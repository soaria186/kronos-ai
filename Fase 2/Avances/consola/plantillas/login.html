{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Iniciar sesión</h1>
  {% if bloqueado %}<p class="error">Demasiados intentos. Espera 15 minutos.</p>{% endif %}
  {% if error %}<p class="error">Usuario, contraseña o código incorrectos.</p>{% endif %}
  <form method="post" action="/login">
    <label>Usuario <input name="usuario" autocomplete="username" required></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <label>Código de la app (6 dígitos)
      <input name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
