# SOAR-VALIDATE, SOAR-EXECUTE, SOAR-NOTIFY y SOAR-CONSOLE. Se suma al docker-compose.yml de la base:
#
#   docker compose -f docker-compose.yml -f servicios.yml up -d --build
#
# Antes: generar_secretos.sh, los secretos manuales de secrets/ y el archivo .env
# (ver servicios/README.md).

services:
  validate:
    build:
      context: ../..
      dockerfile: infra/docker/servicios/Dockerfile
    image: kronos-servicios:local
    pull_policy: build  # imagen local: se construye, nunca se busca en un registro
    command: ["python", "-m", "validacion"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # alerts.json es del usuario wazuh (permiso 640): el contenedor entra por su grupo.
    group_add:
      - "${KRONOS_GID_WAZUH:-999}"
    environment:
      KRONOS_DSN: host=db dbname=kronos user=kronos_worker
      KRONOS_DB_CLAVE_ARCHIVO: /run/secrets/kronos_worker_password
      KRONOS_INQUILINO: ${KRONOS_INQUILINO:?falta KRONOS_INQUILINO en .env}
      KRONOS_ALERTAS: /wazuh-logs/alerts/alerts.json
      KRONOS_POSICION_ARCHIVO: /estado/posicion.json
      KRONOS_OLLAMA_URL: ${KRONOS_OLLAMA_URL:-http://ollama:11434}
      KRONOS_MODELO: ${KRONOS_MODELO:-qwen2.5:7b}
    secrets:
      # Sólo este archivo: no se monta la carpeta de secretos.
      - kronos_worker_password
    volumes:
      # Logs de Wazuh en sólo lectura (acuerdo con Nicolás, 14-10-2026).
      - wazuh_logs:/wazuh-logs:ro
      - validate_estado:/estado
    networks:
      - interna
      - inferencia
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  execute:
    build:
      context: ../..
      dockerfile: infra/docker/servicios/Dockerfile
    image: kronos-servicios:local
    pull_policy: build  # imagen local: se construye, nunca se busca en un registro
    command: ["python", "-m", "ejecucion"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KRONOS_DSN: host=db dbname=kronos user=kronos_worker
      KRONOS_DB_CLAVE_ARCHIVO: /run/secrets/kronos_worker_password
      KRONOS_INQUILINOS: ${KRONOS_INQUILINOS:?falta KRONOS_INQUILINOS en .env}
      KRONOS_WAZUH_URL: ${KRONOS_WAZUH_URL:-https://wazuh.manager:55000}
      KRONOS_WAZUH_USUARIO: ${KRONOS_WAZUH_USUARIO:-kronos-execute}
      KRONOS_WAZUH_CLAVE_ARCHIVO: /run/secrets/wazuh_api_password
      KRONOS_WAZUH_CA: /run/secrets/wazuh_api_ca
      KRONOS_WAZUH_NOMBRE_SERVIDOR: ${KRONOS_WAZUH_NOMBRE_SERVIDOR:-}
    secrets:
      - kronos_worker_password
      - wazuh_api_password
      - wazuh_api_ca
    networks:
      - interna
      - wazuh
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  notify:
    image: kronos-servicios:local
    pull_policy: never  # la construye el servicio execute
    command: ["python", "-m", "notificacion"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      execute:
        condition: service_started  # sólo para que la imagen ya esté construida
    environment:
      KRONOS_DSN: host=db dbname=kronos user=kronos_worker
      KRONOS_DB_CLAVE_ARCHIVO: /run/secrets/kronos_worker_password
      KRONOS_INQUILINOS: ${KRONOS_INQUILINOS:?falta KRONOS_INQUILINOS en .env}
      KRONOS_TELEGRAM_TOKEN_ARCHIVO: /run/secrets/telegram_token
      KRONOS_TELEGRAM_CHAT: ${KRONOS_TELEGRAM_CHAT:?falta KRONOS_TELEGRAM_CHAT en .env}
      KRONOS_TELEGRAM_EQUIPO: ${KRONOS_TELEGRAM_EQUIPO:?falta KRONOS_TELEGRAM_EQUIPO en .env}
    secrets:
      - kronos_worker_password
      - telegram_token
    networks:
      - interna
      - salida
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  consola:
    image: kronos-servicios:local
    pull_policy: never  # la construye el servicio execute
    command: ["python", "-m", "consola"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      execute:
        condition: service_started
    environment:
      KRONOS_DSN_CONSOLA: host=db dbname=kronos user=kronos_console
      KRONOS_CONSOLA_CLAVE_ARCHIVO: /run/secrets/kronos_console_password
      KRONOS_CONSOLA_USUARIOS: /run/secrets/consola_usuarios
      KRONOS_INQUILINOS: ${KRONOS_INQUILINOS:?falta KRONOS_INQUILINOS en .env}
      KRONOS_CONSOLA_CERTIFICADO: /run/secrets/consola_certificado
      KRONOS_CONSOLA_LLAVE: /run/secrets/consola_llave
    secrets:
      - kronos_console_password
      - consola_usuarios
      - consola_certificado
      - consola_llave
    # Sólo en la IP de NetBird (D-17): nunca en 0.0.0.0.
    ports:
      - "${KRONOS_CONSOLA_IP:?falta KRONOS_CONSOLA_IP en .env}:443:8443"
    networks:
      - interna
      - consola
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # Red interna hacia Ollama (infra/ollama/docker-compose.yml la crea con este nombre).
  # Sin salida a internet: VALIDATE sólo habla con el modelo.
  inferencia:
    external: true
    name: ${KRONOS_OLLAMA_RED:-kronos_inferencia}
  # Red del compose de Wazuh: EXECUTE llega a la API como wazuh.manager:55000, sin
  # pasar por internet ni por NetBird.
  wazuh:
    external: true
    name: ${KRONOS_WAZUH_RED:-single-node_default}
  # Salida a internet, sólo para Telegram.
  salida: {}
  # Para publicar el 443 de la consola (una red internal no admite puertos publicados).
  consola: {}

volumes:
  # Volumen de logs del compose de Wazuh (docker volume ls | grep wazuh_logs).
  wazuh_logs:
    external: true
    name: ${KRONOS_WAZUH_LOGS:-single-node_wazuh_logs}
  validate_estado:

secrets:
  kronos_worker_password:
    file: ./secrets/kronos_worker_password
  wazuh_api_password:
    file: ./secrets/wazuh_api_password
  wazuh_api_ca:
    file: ./secrets/wazuh_api_ca.pem
  telegram_token:
    file: ./secrets/telegram_token
  kronos_console_password:
    file: ./secrets/kronos_console_password
  consola_usuarios:
    file: ./secrets/consola_usuarios.json
  consola_certificado:
    file: ./secrets/consola_certificado.pem
  consola_llave:
    file: ./secrets/consola_llave.pem
