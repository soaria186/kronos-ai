name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# El proyecto (código, pruebas y herramientas) está en «Fase 2/Avances»: todos los
# comandos corren ahí, salvo gitleaks, que revisa el repositorio completo.
defaults:
  run:
    working-directory: "Fase 2/Avances"

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (con verificación de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/${checksums}"
          grep " ${tarball}\$" "${checksums}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Escanear todo el historial
        run: gitleaks git --redact --verbose --no-banner .

  ruff:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Buscar archivos Python
        id: py
        run: |
          if [ -n "$(git ls-files '*.py' '*.pyi')" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "No hay archivos .py todavía; se omite el lint."
          fi

      - uses: actions/setup-python@v7
        if: steps.py.outputs.hay == 'true'
        with:
          python-version: "3.12"

      - name: Instalar ruff
        if: steps.py.outputs.hay == 'true'
        run: python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: ruff check
        if: steps.py.outputs.hay == 'true'
        run: ruff check --output-format=github .

  r1:
    name: R1 (decision/ no importa la capa de efectos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Chequeo de R1
        run: python tools/check_r1.py

  pruebas:
    name: pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias de la consola (sin ellas se omiten sus 13 pruebas)
        run: python -m pip install --disable-pip-version-check -r consola/requirements.txt httpx==0.28.1

      - name: unittest (tests/unit), sin pruebas omitidas
        run: |
          set -o pipefail
          python -m unittest discover -s tests/unit -v 2>&1 | tee unittest.log
          if grep -q "skipped=" unittest.log; then
            echo "::error::Hay pruebas omitidas: falta alguna dependencia en el CI."
            exit 1
          fi

  integracion:
    name: pruebas de integración (PostgreSQL 17.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: kronos_admin
          # Base efímera del CI, alcanzable sólo desde el runner: sin contraseña.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kronos_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: kronos_admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias de la capa de base
        run: python -m pip install --disable-pip-version-check -r persistencia/requirements.txt

      - name: Base kronos_pruebas con el esquema de infra/docker/initdb y las migraciones
        run: |
          set -o pipefail
          bash tests/integracion/preparar_base.sh > conexiones.env
          sed -n 's/.*password=\([^ ]*\).*/::add-mask::\1/p' conexiones.env
          cat conexiones.env >> "$GITHUB_ENV"
          rm conexiones.env

      - name: unittest (tests/integracion; sólo se omiten las 5 que usan el modelo)
        run: |
          set -o pipefail
          : "${KRONOS_DSN:?falta KRONOS_DSN}" "${KRONOS_DSN_CONSOLA:?falta}" "${KRONOS_DSN_ADMIN:?falta}"
          python -m unittest discover -s tests/integracion -v 2>&1 | tee integracion.log
          omitidas=$(grep -o "skipped=[0-9]*" integracion.log | cut -d= -f2)
          if [ "${omitidas:-0}" -gt 5 ]; then
            echo "::error::Se omitieron $omitidas pruebas de integración; sólo deberían omitirse las 5 del modelo."
            exit 1
          fi

  entrega:
    name: verificación de la entrega (PR hacia main)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: tools/verificar_entrega.py
        run: python tools/verificar_entrega.py --antes-de-publicar