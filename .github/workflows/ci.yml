name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (con verificación de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/${checksums}"
          grep " ${tarball}\$" "${checksums}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Escanear todo el historial
        run: gitleaks git --redact --verbose --no-banner .

  ruff:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Buscar archivos Python
        id: py
        run: |
          if [ -n "$(git ls-files '*.py' '*.pyi')" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "No hay archivos .py todavía; se omite el lint."
          fi

      - uses: actions/setup-python@v7
        if: steps.py.outputs.hay == 'true'
        with:
          python-version: "3.12"

      - name: Instalar ruff
        if: steps.py.outputs.hay == 'true'
        run: python -m pip install --disable-pip-version-check ruff==0.16.10

      - name: ruff check
        if: steps.py.outputs.hay == 'true'
        run: ruff check --output-format=github .

  r1:
    name: R1 (decision/ no importa la capa de efectos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Chequeo de R1
        run: python tools/check_r1.py
